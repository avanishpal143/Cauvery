<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cauveryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDEAB8" />
      <stop offset="35%" stop-color="#E8A72B" />
      <stop offset="70%" stop-color="#C98218" />
      <stop offset="100%" stop-color="#FCE4A6" />
    </linearGradient>
    <linearGradient id="cauveryLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DAA62" />
      <stop offset="50%" stop-color="#237A3F" />
      <stop offset="100%" stop-color="#0E3D1F" />
    </linearGradient>
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#072010" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Deep Temple Green Medallion Base -->
  <circle cx="50" cy="50" r="46" fill="#0C2F1A" stroke="url(#cauveryGold)" stroke-width="2.6" filter="url(#badgeShadow)"/>
  
  <!-- Temple Beaded Rim -->
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="url(#cauveryGold)" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.8"/>

  <!-- Ornate Banana Leaf Centerpiece -->
  <path d="M50 17 C64 22, 75 36, 70 57 C66 71, 54 81, 50 82 C46 81, 34 71, 30 57 C25 36, 36 22, 50 17 Z" 
        fill="url(#cauveryLeaf)"/>
  
  <!-- Central Leaf Spine -->
  <path d="M50 19 Q50 51 50 78" stroke="url(#cauveryGold)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Lateral Veins -->
  <path d="M50 33 Q61 38 67 45" stroke="url(#cauveryGold)" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>
  <path d="M50 33 Q39 38 33 45" stroke="url(#cauveryGold)" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>
  <path d="M50 48 Q62 53 66 62" stroke="url(#cauveryGold)" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>
  <path d="M50 48 Q38 53 34 62" stroke="url(#cauveryGold)" stroke-width="1.4" stroke-linecap="round" opacity="0.95"/>
  <path d="M50 63 Q58 66 60 73" stroke="url(#cauveryGold)" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
  <path d="M50 63 Q42 66 40 73" stroke="url(#cauveryGold)" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>

  <!-- Golden Dosa Swirl Orbit -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#cauveryGold)" stroke-width="2" stroke-linecap="round" stroke-dasharray="55 25" transform="rotate(-35 50 50)"/>
  
  <!-- Golden Rice Grain Sparkle Crest -->
  <circle cx="50" cy="15" r="3.2" fill="url(#cauveryGold)"/>
</svg>