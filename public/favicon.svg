<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F6B3F" />
      <stop offset="100%" stop-color="#0F2E1D" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE196" />
      <stop offset="50%" stop-color="#E8B04B" />
      <stop offset="100%" stop-color="#C98A2B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <circle cx="50" cy="50" r="48" fill="#0F2E1D" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="43" fill="none" stroke="#2F6B3F" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Stylised Banana Leaf Curve -->
  <path d="M50 20 C 65 24, 76 40, 72 58 C 69 70, 56 80, 50 82 C 44 80, 31 70, 28 58 C 24 40, 35 24, 50 20 Z" 
        fill="url(#leafGrad)" />
  <path d="M50 22 Q 50 52 50 80" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Leaf Veins -->
  <path d="M50 35 Q 60 38 68 45" stroke="#E8B04B" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <path d="M50 35 Q 40 38 32 45" stroke="#E8B04B" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <path d="M50 50 Q 62 53 66 61" stroke="#E8B04B" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <path d="M50 50 Q 38 53 34 61" stroke="#E8B04B" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Golden Dosa / Cauvery Crest Arc -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="60 30" transform="rotate(-40 50 50)"/>
  <circle cx="50" cy="50" r="4" fill="url(#goldGrad)" />
</svg>